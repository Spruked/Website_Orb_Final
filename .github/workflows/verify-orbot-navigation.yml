name: Verify Orbot navigation integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Verify vendored Orbot source identity
        run: |
          test "$(git hash-object backend/authority/orbot_ral/__init__.py)" = "0b7373148a3a8b28edee85da97a76d5bef953061"
          test "$(git hash-object backend/authority/orbot_ral/models.py)" = "6da34ad1eac674602ba142851a20c39bfa48b882"
          test "$(git hash-object backend/authority/orbot_ral/admission.py)" = "40d8a4c5c2594c2b26573dbacfc08e5141be1310"
          test "$(git hash-object backend/authority/orbot_ral/core4.py)" = "e98f7c5002d8b210bdd1eaf432bff680a695ad84"
          test "$(git hash-object backend/authority/orbot_ral/middleware.py)" = "963ec0191635385ff6ca3afc8985f0d3ab75291a"
          test "$(git hash-object backend/authority/orbot_ral/event_bus.py)" = "86c0c79fdb6d3c4087c644fd002e80813174817b"
          test "$(git hash-object backend/authority/orbot_ral/telemetry.py)" = "8e0503303259e70ae1d897ab865945d71c674cd8"

      - name: Compile Python runtime
        run: python -m compileall -q backend

      - name: Run Orbot authority integration tests
        run: python -m unittest backend.tests.test_orbot_authority -v

      - name: Verify legacy site-world compilation remains compatible
        run: python tools/compile_site_world.py
