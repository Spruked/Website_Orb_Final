name: TPC CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy scipy torch matplotlib librosa soundfile pytest

      - name: Run cochlear processor tests
        run: pytest cochlear_processor_3.0/test_skg_cochlear.py -v

      - name: Run EGF stress tests
        run: pytest Epistemic_Gravity_Field/stress_test.py Epistemic_Gravity_Field/perturb_test.py Epistemic_Gravity_Field/distribution_shift_test.py -v
